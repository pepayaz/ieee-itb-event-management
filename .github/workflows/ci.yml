name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Nilai dummy, berlaku untuk seluruh step. CI tidak pernah menyentuh
    # database sungguhan, tetapi `prisma generate` membaca `prisma.config.ts`
    # yang memanggil env("DIRECT_URL") saat dimuat, sehingga variabel ini
    # harus sudah ada sebelum step build.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
      JWT_SECRET: "dummy-secret-for-ci-build-only-not-real"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build application
        run: npm run build
